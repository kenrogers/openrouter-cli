configVersion: 2.0.0
generation:
  sdkClassName: OpenRouter
  maintainOpenAPIOrder: true
  usageSnippets:
    optionalPropertyRendering: withExample
    sdkInitStyle: constructor
  useClassNamesForArrayFields: true
  fixes:
    nameResolutionDec2023: true
    nameResolutionFeb2025: false
    parameterOrderingFeb2024: true
    requestResponseComponentNamesFeb2024: true
    securityFeb2025: true
    sharedErrorComponentsApr2025: false
    sharedNestedComponentsJan2026: false
    nameOverrideFeb2026: true
  auth:
    oAuth2ClientCredentialsEnabled: true
    oAuth2PasswordEnabled: true
    hoistGlobalSecurity: true
  inferSSEOverload: true
  sdkHooksConfigAccess: true
  schemas:
    allOfMergeStrategy: shallowMerge
  requestBodyFieldName: body
  versioningStrategy: automatic
  persistentEdits: {}
  tests:
    generateTests: false
    generateNewTests: true
    skipResponseBodyAssertions: false
    repoUrl: https://github.com/kenrogers/openrouter-cli
cli:
  version: 0.1.0
  additionalDependencies:
    github.com/zalando/go-keyring: v0.2.6
    golang.org/x/term: v0.37.0
  cliName: openrouter
  distribution:
    homebrew:
      enabled: false
      tap: ""
    nfpm:
      enabled: false
      formats: deb,rpm
      license: ""
      maintainer: ""
    winget:
      enabled: false
      license: ""
      packageIdentifier: ""
      publisher: ""
      publisherUrl: ""
      repositoryOwner: ""
  enableCustomCodeRegions: true
  envVarPrefix: OPENROUTER
  generateRelease: true
  imports:
    option: openapi
    paths:
      callbacks: models/callbacks
      errors: models/apierrors
      operations: models/operations
      shared: models/components
      webhooks: models/webhooks
  interactiveAuth: true
  interactiveMode: true
  interactiveTheme:
    accentColor: '#38BDF8'
    dimmedColor: '#64748B'
    errorColor: '#F87171'
    subtleColor: '#475569'
    successColor: '#4ADE80'
  packageName: github.com/kenrogers/openrouter-cli
  removeStutter: true
